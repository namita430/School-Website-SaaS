server:
  port: 8080

spring:
  application:
    name: school-saas-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_saas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  auth:
    # Keep this true by default. Set REFRESH_COOKIE_SECURE=false only for
    # local HTTP development, where browsers otherwise discard the cookie.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  jwt:
    secret: ${JWT_SECRET:change-this-in-env-never-commit-a-real-secret}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  public-site:
    base-domain: ${PUBLIC_BASE_DOMAIN:yoursaas.com}
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./media-storage}
    public-url-prefix: /media
    max-size-bytes: 10485760
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif,application/pdf

logging:
  level:
    com.schoolsaas: INFO
